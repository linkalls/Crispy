name: Android APK Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: 1
      NODE_ENV: production
      EXPO_NO_TELEMETRY: 1
      ANDROID_NDK_VERSION: 27.1.12297006
      ANDROID_CMAKE_VERSION: 3.22.1
      REACT_NATIVE_ARCHITECTURES: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          for attempt in 1 2 3; do
            if sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"; then
              break
            fi

            echo "NDK install failed on attempt ${attempt}; cleaning partial download before retry."
            rm -rf "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" "${ANDROID_HOME}/.temp"

            if [ "${attempt}" = "3" ]; then
              exit 1
            fi

            sleep 10
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch Metro Babel alias
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -d node_modules/@babel/traverse ]; then
            echo "@babel/traverse is missing after bun install."
            exit 1
          fi

          if [ ! -e node_modules/@babel/traverse--for-generate-function-map ]; then
            ln -s traverse node_modules/@babel/traverse--for-generate-function-map
          fi

          node -e "require('@babel/traverse--for-generate-function-map'); console.log('Metro Babel alias is resolvable')"

      - name: Build Android project (release)
        run: |
          bunx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=${REACT_NATIVE_ARCHITECTURES}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crispy-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
